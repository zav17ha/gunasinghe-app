<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gunasinghe Group</title>
<meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D100F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gunasinghe Group">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone-first ledger app — sticky header, one scrolling column (max 640px), fixed bottom tab bar, bottom sheets for entry */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --fg:#151918; --muted:#6A716E; --line:#E2E5E2;
  --accent:#0D7A5B; --accent-soft:#E1F0EA; --neg:#C33A2F; --neg-soft:#FBE9E7; --warn:#A86400; --warn-soft:#FBF0DC;
  --c-driver:#5B6BD6; --c-fuel:#D98B1E; --c-repair:#C33A2F; --c-loan:#7A5BB8; --c-ins:#2C8FB0; --c-toll:#4E8A2E; --c-other:#8A918E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D100F; --surface:#181C1A; --fg:#ECEFED; --muted:#98A09C; --line:#272D2A;
  --accent:#3DBE92; --accent-soft:#153328; --neg:#FF6F62; --neg-soft:#3A1A17; --warn:#E3A33D; --warn-soft:#3A2B12;
  --c-driver:#8C98F0; --c-fuel:#EDA543; --c-repair:#FF6F62; --c-loan:#AE8FE6; --c-ins:#5EC0E0; --c-toll:#93CC6A; --c-other:#9AA19E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D100F; --surface:#181C1A; --fg:#ECEFED; --muted:#98A09C; --line:#272D2A;
  --accent:#3DBE92; --accent-soft:#153328; --neg:#FF6F62; --neg-soft:#3A1A17; --warn:#E3A33D; --warn-soft:#3A2B12;
  --c-driver:#8C98F0; --c-fuel:#EDA543; --c-repair:#FF6F62; --c-loan:#AE8FE6; --c-ins:#5EC0E0; --c-toll:#93CC6A; --c-other:#9AA19E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate{font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border:1.5px solid var(--fg);border-radius:6px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:6px 24px}

.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.seg{display:flex;background:color-mix(in srgb,var(--fg) 7%,transparent);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.card{background:var(--surface);border-radius:var(--r);padding:16px}
.hero .label{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.hero .big.neg{color:var(--neg)}
.hero .sub{margin-top:8px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.photo{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.photo img{max-width:100%;max-height:420px;border-radius:12px;display:block;background:var(--surface)}
.photo-add{width:100%;border-style:dashed}
.row > button.main{padding:0;min-width:0}
.login{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.login h2{margin:0;font-family:var(--font-display);font-size:24px;letter-spacing:-.02em}
.login .field label{width:30%}
.signed{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#04150F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04150F}}
.btn.danger{color:var(--neg);background:var(--neg-soft);border-color:transparent}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px -6px}
.section-title h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.section-title span{color:var(--muted);font-size:13px}

.rows{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
button.row:active{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.datebox{width:40px;flex:none;text-align:center;line-height:1.1}
.datebox b{display:block;font-size:18px;font-family:var(--font-display)}
.datebox span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}

.brk .row{flex-wrap:wrap;row-gap:6px}
.bar{flex-basis:100%;height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 7%,transparent);overflow:hidden;margin-left:22px}
.bar i{display:block;height:100%;border-radius:2px}
.row.total .t,.row.total .amt{font-size:16px;font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.group-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px;margin-bottom:-8px;text-transform:uppercase;letter-spacing:.05em}
.empty{text-align:center;padding:32px 20px;color:var(--muted);background:var(--surface);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:18px;margin-top:2px;font-family:var(--font-display)}
.chart{background:var(--surface);border-radius:var(--r);padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 4px 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
/* diesel calculator */
.calc{display:flex;flex-direction:column;gap:14px}
.calc-l{font-size:13px;color:var(--muted);font-weight:600}
.calc-in{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-top:-6px}
.calc-in input{flex:1;min-width:0;width:100%;border:0;background:transparent;font-family:var(--font-display);font-size:48px;font-weight:700;letter-spacing:-.03em;outline:none;padding:0;font-variant-numeric:tabular-nums}
.calc-in input::placeholder{color:color-mix(in srgb,var(--muted) 45%,transparent)}
.calc-in span{font-size:24px;color:var(--muted);font-weight:600}
.calc-out{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calc-out span{font-size:15px;color:var(--muted)}
.calc-out b{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--c-fuel)}
.price-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--c-fuel) 13%,transparent);text-align:left;width:100%}
.price-btn b{font-size:16px}
.price-btn span{font-size:13px;color:var(--muted)}
.price-btn em{font-style:normal;font-weight:600;color:var(--c-fuel);font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px 6px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px;position:sticky;top:-10px;background:var(--bg);z-index:1}
.sheet-h h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.sheet-h .x{color:var(--accent);font-weight:600;font-size:16px;padding:6px 2px}
.form{display:flex;flex-direction:column;gap:14px}
.fields{background:var(--surface);border-radius:var(--r);overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.field label{flex:none;width:42%;max-width:170px;font-size:15px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;text-align:right;outline:none}
.field textarea{text-align:left;resize:vertical;min-height:60px}
.field input::placeholder,.field textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.field .unit{color:var(--muted);font-size:14px}
.field.computed{background:var(--accent-soft)}
.field.computed b{flex:1;text-align:right;font-size:18px;font-family:var(--font-display);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);padding:0 4px;margin-top:-6px}
.err{color:var(--neg);font-size:14px;padding:0 4px}
.row-btns{display:flex;gap:10px}
.row-btns .btn{flex:1}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><small>Transport service</small><h1>Gunasinghe Group</h1></div>
    <span class="plate num" id="plate" hidden></span>
    <button class="icon-btn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</button>
    <button data-tab="hires"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8" fill="var(--surface)"/><circle cx="17" cy="17.5" r="1.8" fill="var(--surface)"/></svg>Hires</button>
    <button data-tab="diesel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M6 8h6M14 10h2.5a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>Diesel</button>
    <button data-tab="costs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>Costs</button>
    <button data-tab="driver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Driver</button>
  </div>
</nav>

<div id="scrim" class="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script src="/api/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const rs = n => 'Rs ' + Math.round(n).toLocaleString('en-US');
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthKey = s => s.slice(0,7);
const monthLabel = k => { const [y,m] = k.split('-').map(Number); return MON[m-1]+' '+y; };
const weekLabel = ws => { const a = parse(ws), b = parse(addDays(ws,6));
  return a.getMonth()===b.getMonth() ? a.getDate()+' – '+b.getDate()+' '+MON[b.getMonth()] : a.getDate()+' '+MON[a.getMonth()]+' – '+b.getDate()+' '+MON[b.getMonth()]; };
const short = n => { const a = Math.abs(n); return a>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : a>=1000 ? Math.round(n/1000)+'k' : String(Math.round(n)); };

const TYPES = {
  fuel:{label:'Fuel', color:'var(--c-fuel)'},
  repair:{label:'Repairs', color:'var(--c-repair)'},
  loan:{label:'Loan', color:'var(--c-loan)'},
  insurance:{label:'Insurance & licence', short:'Insurance', color:'var(--c-ins)'},
  toll:{label:'Highway bills', short:'Highway', color:'var(--c-toll)'},
  other:{label:'Other', color:'var(--c-other)'}
};
const INS_KINDS = ['Insurance','Revenue licence','Emission test','Fitness certificate','Other permit'];
const TOLL_KINDS = ['Highway bill','Gate pass'];
const billsOwed = () => S.expenses.filter(x=>x.type==='toll' && x.reimbursed===false);
function tollSub(x){
  const h = x.hireId && S.hires.find(h=>h.id===x.hireId);
  return [x.place, x.billNo?'No. '+x.billNo:'', h?'for '+(h.customer||'hire'):''].filter(Boolean).join(' · ') || (x.kind||'Highway bill');
}
let assetsCap = null;
const DEF = {vehicle:'', driver:'', driverMode:'fixed', driverValue:'', diesel:397, kmRate:'', dayRate:'', loan:'', insExp:'', licExp:'', emiExp:''};

const S = {hires:[], expenses:[], payouts:[], passes:[], settingsDoc:null, loaded:{hires:false,expenses:false,payouts:false,passes:false},
  tab:'overview', period:'month', hireFilter:'all', costFilter:'all', status:'connecting'};
const settings = () => Object.assign({}, DEF, S.settingsDoc || {});
let db = null, userCap = null, meId = null, canWrite = true;

/* ---------- money logic ---------- */
function hireTotal(h){
  const base = h.mode==='km' ? num(h.km)*num(h.kmRate) : h.mode==='day' ? num(h.days)*num(h.dayRate) : num(h.amount);
  return base + num(h.extra);
}
function defaultDriverPay(total){
  const st = settings();
  if (st.driverMode==='percent') return Math.round(total*num(st.driverValue)/100);
  return num(st.driverValue);
}
function range(period){
  const t = today();
  if (period==='week'){ const a = weekStart(t); return [a, addDays(a,6)]; }
  if (period==='month') return [t.slice(0,7)+'-01', t.slice(0,7)+'-31'];
  if (period==='year') return [t.slice(0,4)+'-01-01', t.slice(0,4)+'-12-31'];
  return ['0000-00-00','9999-99-99'];
}
const inR = (d,[a,b]) => d>=a && d<=b;
function summarize(r){
  const hires = S.hires.filter(h=>inR(h.date,r));
  const exps = S.expenses.filter(e=>inR(e.date,r));
  const income = hires.reduce((s,h)=>s+num(h.total),0);
  const driver = hires.reduce((s,h)=>s+num(h.driverPay),0);
  const byType = {fuel:0,repair:0,loan:0,insurance:0,toll:0,other:0};
  exps.forEach(e=>{ byType[e.type in byType ? e.type : 'other'] += num(e.amount); });
  const costs = driver + Object.values(byType).reduce((a,b)=>a+b,0);
  const litres = exps.filter(e=>e.type==='fuel').reduce((s,e)=>s+num(e.litres),0);
  const km = hires.reduce((s,h)=>s+(h.mode==='km'?num(h.km):0),0);
  return {hires, exps, income, driver, byType, costs, profit:income-costs, litres, km};
}
function driverWeeks(){
  const m = {};
  const get = k => m[k] || (m[k] = {week:k, earned:0, count:0, paid:0, payouts:[]});
  S.hires.forEach(h=>{ const w = get(weekStart(h.date)); w.earned += num(h.driverPay); w.count++; });
  S.payouts.forEach(p=>{ const w = get(p.week || weekStart(p.date)); w.paid += num(p.amount); w.payouts.push(p); });
  return Object.values(m).sort((a,b)=>b.week.localeCompare(a.week));
}

function chart(){
  const t = today(); const d = parse(t.slice(0,7)+'-01'); const months = [];
  for (let i=5;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); months.push(iso(x).slice(0,7)); }
  const data = months.map(k=>{ const s = summarize([k+'-01',k+'-31']); return {k, inc:s.income, cost:s.costs}; });
  const max = Math.max(...data.map(x=>Math.max(x.inc,x.cost)));
  const nice = (()=>{ if (max<=0) return 100000; const p = Math.pow(10, Math.floor(Math.log10(max))); const f = max/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; })();
  const W=600,H=210,L=44,R=8,T=10,B=26, ih=H-T-B, iw=W-L-R, gw=iw/6, bw=Math.min(26,gw*0.3);
  const y = v => T + ih - (v/nice)*ih;
  let g = '';
  [0, nice/2, nice].forEach(v=>{ g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`; });
  data.forEach((m,i)=>{
    const cx = L + gw*i + gw/2;
    const hi = Math.max(0, (m.inc/nice)*ih), hc = Math.max(0,(m.cost/nice)*ih);
    g += `<rect x="${cx-bw-2}" y="${T+ih-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--accent)"><title>${monthLabel(m.k)} income ${rs(m.inc)}</title></rect>`;
    g += `<rect x="${cx+2}" y="${T+ih-hc}" width="${bw}" height="${hc}" rx="3" fill="var(--c-other)"><title>${monthLabel(m.k)} costs ${rs(m.cost)}</title></rect>`;
    g += `<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${MON[+m.k.slice(5)-1]}</text>`;
  });
  return `<div class="chart"><div class="legend"><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--c-other)"></i>Costs</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income and costs">${g}</svg></div>`;
}

function fmtDate(s){ const d = parse(s); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function datebox(s){ const d = parse(s); return `<div class="datebox"><b class="num">${d.getDate()}</b><span>${DOW[d.getDay()]}</span></div>`; }

function grouped(items, rowFn, amtFn, fmt){
  fmt = fmt || rs;
  const groups = {};
  items.forEach(x=>{ (groups[monthKey(x.date)] ||= []).push(x); });
  return Object.keys(groups).sort().reverse().map(k=>{
    const list = groups[k].sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
    return `<div class="group-h"><span>${monthLabel(k)}</span><span class="num">${fmt(list.reduce((s,x)=>s+amtFn(x),0))}</span></div><div class="rows">${list.map(rowFn).join('')}</div>`;
  }).join('');
}

  </div>

  html += `<div class="stats">

/* ---------- sheets ---------- */
function openSheet(html){ $('#sheet').innerHTML = html; $('#scrim').hidden = false; document.body.style.overflow='hidden'; const f = $('#sheet input:not([type=date]),#sheet select'); }
function closeSheet(){ $('#scrim').hidden = true; $('#sheet').innerHTML=''; document.body.style.overflow=''; }
$('#scrim').addEventListener('click', e=>{ if (e.target.id==='scrim') closeSheet(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });

const head = (title, editing) => `<div class="sheet-h"><button class="x" data-close>Cancel</button><h3>${title}</h3><span style="width:52px"></span></div>`;
const field = (id,label,attrs='',unit='') => `<div class="field"><label for="${id}">${label}</label><input id="${id}" ${attrs}>${unit?`<span class="unit">${unit}</span>`:''}</div>`;
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const footer = (editing) => `<div class="err" id="formErr" hidden></div><div class="row-btns">${editing?`<button class="btn danger" data-del>Delete</button>`:''}<button class="btn primary" data-save ${canWrite&&db?'':'disabled'}>${editing?'Save changes':'Save'}</button></div><div class="hint" id="byline"></div>`;
function showErr(msg){ const e = $('#formErr'); e.textContent = msg; e.hidden = false; }
function armDelete(btn, fn){
  if (btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Tap again to delete';
  setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.armed; btn.textContent='Delete'; } }, 3000);
}
async function byline(rec){
  if (rec && rec.byName){ const el = $('#byline'); if (el) el.textContent = 'Added by ' + rec.byName; return; }
  if (!rec || !rec.by || !userCap || !userCap.profiles) return;
  try { const ps = await userCap.profiles([rec.by]); const n = ps && ps[rec.by] && ps[rec.by].name; const el = $('#byline'); if (el && n) el.textContent = 'Added by ' + n; } catch(e){}
}
async function save(coll, id, data){
  const btn = $('#sheet [data-save]'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const ref = id ? db.collection(coll).doc(id) : db.collection(coll).doc();
    const body = Object.assign({}, data, {updatedAt: Date.now()});
    if (!id){ body.createdAt = Date.now(); if (meId) body.by = meId; if (myName) body.byName = myName; }
    else { const old = (S[coll]||[]).find(x=>x.id===id); if (old){ if (old.createdAt) body.createdAt = old.createdAt; if (old.by) body.by = old.by; if (old.byName) body.byName = old.byName; } }
    await ref.set(body);
    closeSheet();
  } catch(e){
    btn.disabled = false; btn.textContent = 'Save';
    if (e && e.code==='invalid_argument'){ canWrite = false; render(); showErr('This account is not on the members list in Supabase, so it cannot save.'); }
    else if (e && e.code==='quota_exceeded') showErr('Storage is full. Delete some old entries and try again.');
    else showErr('Could not save. Check your connection and try again.');
  }
}
async function remove(coll, id){
  try { await db.collection(coll).doc(id).delete(); closeSheet(); } catch(e){ showErr('Could not delete. Check your connection and try again.'); }
}

/* cost sheet */
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload = res; img.onerror = rej; img.src = url; });
    const s = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}

const CFG = window.GB_CONFIG || {};
const sb = (window.supabase && CFG.supabaseUrl && CFG.supabaseKey && !/YOUR-PROJECT/.test(CFG.supabaseUrl))
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;

const mapErr = e => (e && (e.code==='42501' || /row-level security|permission/i.test(e.message||''))) ? {code:'invalid_argument', message:e.message} : {code:'unavailable', message:(e&&e.message)||'Network error'};

function makeDb(){
  const cache = {}, loaded = new Set(), loading = {}, listeners = [];
  const notify = c => listeners.filter(l=>l.c===c).forEach(l=>l.fire());
  const put = (c,id,d) => { (cache[c] ||= new Map()).set(id,d); notify(c); };
  const drop = (c,id) => { if (cache[c]){ cache[c].delete(id); notify(c); } };
  function load(c){
    if (loading[c]) return loading[c];
    return loading[c] = (async () => {
      const rows = []; let from = 0; const page = 1000;
      for (;;){
        const {data, error} = await sb.from('records').select('id,data').eq('coll', c).range(from, from+page-1);
        if (error) throw mapErr(error);
        rows.push(...data); if (data.length < page) break; from += page;
      }
      cache[c] = new Map(rows.map(r=>[r.id, r.data])); loaded.add(c); notify(c);
    })().finally(()=>{ delete loading[c]; });
  }
  // live updates from the other phones
  sb.channel('gb-records').on('postgres_changes', {event:'*', schema:'public', table:'records'}, p=>{
    if (p.eventType==='DELETE'){ const o = p.old || {}; if (o.coll) drop(o.coll, o.id); }
    else if (p.new && cache[p.new.coll]) put(p.new.coll, p.new.id, p.new.data);
  }).subscribe();
  // catch up after the phone was asleep
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') [...loaded].forEach(c=>load(c).catch(()=>{})); });

  function docRef(c, id){
    const ref = {
      id,
      async set(d){
        const {error} = await sb.from('records').upsert({coll:c, id, data:d, updated_at:new Date().toISOString()});
        if (error) throw mapErr(error); put(c, id, d);
      },
      async update(d){
        let cur = cache[c] && cache[c].get(id);
        if (!cur){ const {data} = await sb.from('records').select('data').eq('coll',c).eq('id',id).maybeSingle(); cur = data && data.data; }
        if (!cur) throw {code:'invalid_argument', message:'Not found'};
        return ref.set(Object.assign({}, cur, d));
      },
      async delete(){
        const {error} = await sb.from('records').delete().eq('coll',c).eq('id',id);
        if (error) throw mapErr(error); drop(c, id);
      },
      onSnapshot(next, err){
        const l = {c, fire:()=>{ const d = cache[c] && cache[c].get(id); next({id, exists:!!d, data:()=>d, metadata:{fromCache:!loaded.has(c), hasPendingWrites:false}}); }};
        listeners.push(l);
        if (loaded.has(c)) l.fire(); else load(c).catch(e=>err && err(e));
        return ()=>{ const i = listeners.indexOf(l); if (i>=0) listeners.splice(i,1); };
      }
    };
    return ref;
  }
  return {
    doc(path){ const [c,id] = path.split('/'); return docRef(c,id); },
    collection(c){
      return {
        doc: id => docRef(c, id || uid()),
        onSnapshot(next, err){
          const l = {c, fire:()=>{ const m = cache[c] || new Map(); const docs = [...m.entries()].map(([id,d])=>({id, exists:true, data:()=>d}));
            next({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:!loaded.has(c), hasPendingWrites:false}}); }};
          listeners.push(l);
          if (loaded.has(c)) l.fire(); else load(c).catch(e=>err && err(e));
          return ()=>{ const i = listeners.indexOf(l); if (i>=0) listeners.splice(i,1); };
        }
      };
    }
  };
}

    if (error) throw {code: /size|large/i.test(error.message||'') ? 'too_large' : 'upstream_error', message:error.message};

const toEmail = u => { u = String(u||'').trim().toLowerCase(); return u.includes('@') ? u : u + '@' + USER_DOMAIN; };
async function usersApi(action, payload){
  const {data} = await sb.auth.getSession();
  const tok = data && data.session ? data.session.access_token : '';
  let r;
  try { r = await fetch('/api/users', {method:'POST', headers:{'Content-Type':'application/json', ...(tok?{Authorization:'Bearer '+tok}:{})}, body:JSON.stringify(Object.assign({action}, payload||{}))}); }
  catch(e){ throw Object.assign(new Error('Could not reach the server. Check your connection.'), {status:0}); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw Object.assign(new Error(j.message || 'Something went wrong.'), {status:r.status});
  return j;
}

async function loadUsers(){
  const box = $('#usersBox'); if (!box) return;

  try { const j = await usersApi('list'); Object.assign(st, {state:'ok', users:j.users, me:j.me}); }
  catch(x){ if (x.status===403) { st.state = 'hidden'; } else { st.state = 'error'; st.message = x.status===503 ? 'To add users from here, connect Supabase in the Vercel Storage tab.' : x.message; } }
  const draw = (msg) => { box.innerHTML = usersBoxHtml(st); if (msg){ const m = $('#u-msg'); if (m) m.textContent = msg; } };
  draw();
  box.onclick = async ev=>{
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.upw){ st.pw = st.pw===b.dataset.upw ? null : b.dataset.upw; draw(); const i = $('#u-newpw'); if (i) i.focus(); return; }

      catch(x){ draw(x.message); }
      return;
    }

      if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Tap again'; setTimeout(()=>{ if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Remove'; } }, 3000); return; }
      b.disabled = true; b.textContent = 'Removing…';
      try { await usersApi('remove', {username:b.dataset.urm}); st.users = st.users.filter(u=>u.username!==b.dataset.urm); draw('@'+b.dataset.urm+' can no longer sign in. Their past entries are kept.'); }
      catch(x){ draw(x.message); }
      return;
    }
    if (b.id==='u-add'){
      const name = $('#u-name').value.trim(), username = $('#u-user').value.trim().toLowerCase(), password = $('#u-pass').value;
      if (!/^[a-z0-9._-]{3,20}$/.test(username)) return draw('Username must be 3 to 20 letters or numbers, with no spaces.');

function begin(session){
  meId = session.user.id;
  const md = session.user.user_metadata || {};
  myName = md.name || md.full_name || (session.user.email||'').split('@')[0];
  S.me = md.username ? '@'+md.username : (session.user.email||'');
  db = makeDb(); assetsCap = photoStore; canWrite = true;
  S.auth = 'in'; S.status = 'ok'; render();
  const timer = setTimeout(()=>{ if (loading()){ S.status = 'slow'; render(); } }, 10000);
  const done = () => { if (!loading()){ clearTimeout(timer); if (S.status==='slow') S.status='ok'; } };
  const onErr = e => { clearTimeout(timer); S.status = e && e.code==='invalid_argument' ? 'denied' : 'slow'; if (S.status==='denied') canWrite = false; render(); };
  ['hires','expenses','payouts','passes'].forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c] = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(x=>x.date);
      if (!snap.metadata.fromCache) S.loaded[c] = true;
      done(); render();
    }, onErr);
  });
  db.doc('settings/main').onSnapshot(s=>{ S.settingsDoc = s.exists ? s.data() : null; render(); }, ()=>{});
}

/* ---------- start ---------- */
(async function start(){
  if (!sb){ S.status = 'offline'; canWrite = false; render(); return; }
  sb.auth.onAuthStateChange(ev=>{ if (ev==='SIGNED_OUT') location.reload(); });
  const {data} = await sb.auth.getSession();
  if (data && data.session){ begin(data.session); return; }
  S.auth = 'loading'; render();
  try {
    const r = await fetch('/api/users?action=status', {cache:'no-store'});
    const j = r.ok ? await r.json() : {};
    if (j.domain) USER_DOMAIN = j.domain;
    S.auth = j.needsSetup ? 'setup' : 'login';
  } catch(e){ S.auth = 'login'; }
  render();
})();
})();

</script>
